name: Maintain armed pull requests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: skvallerbyttan-pr-auto-merge-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta Gamnacken App-token för organisationen
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout maintainer-logik
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Håll armerade PR:er aktuella
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              join(process.env.GITHUB_WORKSPACE, 'scripts/pr-auto-merge-maintenance.mjs'),
            ).href;
            const { runMaintenance } = await import(moduleUrl);
            await runMaintenance({ github, core, owner: context.repo.owner });
