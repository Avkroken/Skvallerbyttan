name: Maintain armed pull requests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: skvallerbyttan-pr-auto-merge-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta Gamnacken App-token för organisationen
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Håll armerade PR:er aktuella
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const repositories = await github.paginate(
              github.rest.repos.listForOrg,
              { org: owner, type: 'all', per_page: 100 },
            );

            for (const repository of repositories) {
              if (repository.archived || repository.disabled) continue;

              const repo = repository.name;
              const base = repository.default_branch;

              let pulls;
              try {
                pulls = await github.paginate(
                  github.rest.pulls.list,
                  { owner, repo, state: 'open', base, per_page: 100 },
                );
              } catch (error) {
                core.warning(`${owner}/${repo}: kunde inte lista PR:er: ${error.message}`);
                continue;
              }

              for (const pull of pulls) {
                if (pull.draft) continue;
                if (pull.auto_merge == null) continue;
                if (pull.head?.repo?.full_name !== `${owner}/${repo}`) continue;

                const number = pull.number;
                let current = pull;

                try {
                  let comparison = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${current.base.sha}...${current.head.sha}`,
                  });

                  if (comparison.data.behind_by === 0) {
                    core.info(`${owner}/${repo}#${number}: redan aktuell och armerad.`);
                    continue;
                  }

                  core.info(
                    `${owner}/${repo}#${number}: uppdaterar mot ${base} (behind_by=${comparison.data.behind_by}).`,
                  );

                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number: number,
                    expected_head_sha: current.head.sha,
                  });

                  let currentWithBase = false;
                  for (let attempt = 1; attempt <= 20; attempt += 1) {
                    await sleep(3000);
                    const response = await github.rest.pulls.get({ owner, repo, pull_number: number });
                    current = response.data;

                    if (current.state !== 'open') {
                      core.info(`${owner}/${repo}#${number}: PR:n stängdes under uppdateringen.`);
                      currentWithBase = true;
                      break;
                    }

                    comparison = await github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${current.base.sha}...${current.head.sha}`,
                    });

                    if (comparison.data.behind_by === 0) {
                      currentWithBase = true;
                      break;
                    }
                  }

                  if (!currentWithBase) {
                    core.warning(`${owner}/${repo}#${number}: blev inte aktuell inom 60 sekunder.`);
                    continue;
                  }

                  if (current.state !== 'open') continue;

                  if (current.auto_merge == null) {
                    core.info(`${owner}/${repo}#${number}: återarmerar native squash auto-merge.`);
                    await github.graphql(
                      `mutation($pullRequestId: ID!) {
                        enablePullRequestAutoMerge(input: {
                          pullRequestId: $pullRequestId,
                          mergeMethod: SQUASH
                        }) {
                          pullRequest { number }
                        }
                      }`,
                      { pullRequestId: current.node_id },
                    );
                  } else {
                    core.info(`${owner}/${repo}#${number}: aktuell och fortsatt armerad.`);
                  }
                } catch (error) {
                  core.warning(`${owner}/${repo}#${number}: underhåll misslyckades: ${error.message}`);
                }
              }
            }
