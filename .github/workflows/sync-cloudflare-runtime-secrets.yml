name: Sync Cloudflare runtime secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skvallerbyttan-production
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Worker-only runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}
      SOURCE_GAMNACKEN_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GAMNACKEN_GITHUB_APP_PRIVATE_KEY }}
      SOURCE_SKVALLERBYTTAN_READ_API_TOKEN: ${{ secrets.SKVALLERBYTTAN_READ_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate runtime sync credentials
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_API_TOKEN
            SOURCE_GAMNACKEN_GITHUB_APP_PRIVATE_KEY
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required organization secret is not configured: ${name}"
              exit 1
            fi
          done

          if [[ -z "${SOURCE_SKVALLERBYTTAN_READ_API_TOKEN:-}" ]]; then
            echo "::notice::SKVALLERBYTTAN_READ_API_TOKEN is not configured as an organization secret; machine API secret will not be changed."
          fi

      - name: Verify repository before production mutation
        run: npm run check

      - name: Sync Worker-only secrets
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE' | npx wrangler secret bulk
          const values = {
            GAMNACKEN_GITHUB_APP_PRIVATE_KEY:
              process.env.SOURCE_GAMNACKEN_GITHUB_APP_PRIVATE_KEY,
          };

          if (process.env.SOURCE_SKVALLERBYTTAN_READ_API_TOKEN) {
            values.SKVALLERBYTTAN_READ_API_TOKEN =
              process.env.SOURCE_SKVALLERBYTTAN_READ_API_TOKEN;
          }

          for (const [name, value] of Object.entries(values)) {
            if (!value) throw new Error(`missing source secret: ${name}`);
          }

          process.stdout.write(JSON.stringify(values));
          NODE

      - name: Verify Worker secret names
        run: npx wrangler secret list
