name: Sync Cloudflare runtime secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skvallerbyttan-cloudflare-runtime-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_CLOUDFLARE_NOTIFICATIONS_WEBHOOK_SECRET: ${{ secrets.CLOUDFLARE_NOTIFICATIONS_WEBHOOK_SECRET }}
      SOURCE_CLOUDFLARE_CASB_WEBHOOK_SECRET: ${{ secrets.CLOUDFLARE_CASB_WEBHOOK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate canonical organization secrets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            SOURCE_CLOUDFLARE_NOTIFICATIONS_WEBHOOK_SECRET
            SOURCE_CLOUDFLARE_CASB_WEBHOOK_SECRET
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required organization secret is not configured: ${name}"
              exit 1
            fi
          done

          if [[ "$SOURCE_CLOUDFLARE_NOTIFICATIONS_WEBHOOK_SECRET" == "$SOURCE_CLOUDFLARE_CASB_WEBHOOK_SECRET" ]]; then
            echo "::error::Notifications and CASB must use separate webhook secrets."
            exit 1
          fi

      - name: Verify repository before production mutation
        run: npm run check

      - name: Sync canonical organization secrets to Worker runtime
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE' | npx wrangler secret bulk
          const values = {
            CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_API_TOKEN: process.env.CLOUDFLARE_API_TOKEN,
            CLOUDFLARE_NOTIFICATIONS_WEBHOOK_SECRET:
              process.env.SOURCE_CLOUDFLARE_NOTIFICATIONS_WEBHOOK_SECRET,
            CLOUDFLARE_CASB_WEBHOOK_SECRET:
              process.env.SOURCE_CLOUDFLARE_CASB_WEBHOOK_SECRET,
          };

          for (const [name, value] of Object.entries(values)) {
            if (!value) throw new Error(`missing source secret: ${name}`);
          }

          process.stdout.write(JSON.stringify(values));
          NODE

      - name: Verify runtime secret names
        run: npx wrangler secret list
