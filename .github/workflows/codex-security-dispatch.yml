name: Dispatch security issues to Codex PRs

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: skvallerbyttan-codex-security-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_TRIGGER_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
      CODEX_TRIGGER_LOGIN: ${{ vars.CODEX_TRIGGER_LOGIN }}
    steps:
      - name: Hämta Gamnacken App-token för organisationen
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Hämta dispatcher-policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Reconcile remediation PRs and dispatch safely
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DISPATCH_RUN_ID: ${{ github.run_id }}
          DISPATCH_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/codex-security-dispatch.cjs`);
            await run({ github, context, core });
