name: Apply PEM fix

on:
  push:
    branches:
      - work/github-app-pem

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/github-app-pem
      - name: Patch PEM handling
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/index.ts')
          source = path.read_text()
          old = '''function pemBytes(pem: string): ArrayBuffer {
            const body = pem.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\\s/g, "");
            const binary = atob(body);
            return Uint8Array.from(binary, (c) => c.charCodeAt(0)).buffer;
          }'''
          new = '''function derLength(length: number): Uint8Array {
            if (length < 0x80) return Uint8Array.of(length);
            const bytes: number[] = [];
            for (let value = length; value > 0; value >>>= 8) bytes.unshift(value & 0xff);
            return Uint8Array.of(0x80 | bytes.length, ...bytes);
          }

          function der(tag: number, value: Uint8Array): Uint8Array {
            const length = derLength(value.length);
            return Uint8Array.from([tag, ...length, ...value]);
          }

          function pemPkcs8Bytes(pem: string): ArrayBuffer {
            const pkcs1 = pem.includes("-----BEGIN RSA PRIVATE KEY-----");
            const body = pem
              .replace(/-----BEGIN (?:RSA )?PRIVATE KEY-----|-----END (?:RSA )?PRIVATE KEY-----|\\s/g, "");
            if (!body) throw new Error("GitHub App private key PEM is empty or invalid");
            const binary = atob(body);
            const keyBytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
            if (!pkcs1) return keyBytes.buffer;

            const version = Uint8Array.of(0x02, 0x01, 0x00);
            const rsaEncryptionAlgorithm = Uint8Array.of(
              0x30, 0x0d,
              0x06, 0x09, 0x2a, 0x86, 0x48, 0x86, 0xf7, 0x0d, 0x01, 0x01, 0x01,
              0x05, 0x00,
            );
            return der(0x30, Uint8Array.from([
              ...version,
              ...rsaEncryptionAlgorithm,
              ...der(0x04, keyBytes),
            ])).buffer;
          }'''
          if old not in source:
              raise SystemExit('Expected pemBytes implementation not found')
          source = source.replace(old, new).replace('pemBytes(env.SKVALLERBYTTAN_APP_PRIVATE_KEY)', 'pemPkcs8Bytes(env.SKVALLERBYTTAN_APP_PRIVATE_KEY)')
          path.write_text(source)
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-pem-fix.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts .github/workflows/apply-pem-fix.yml
          git commit -m "Support GitHub App RSA PEM keys"
          git push origin HEAD:work/github-app-pem
