name: Check Codex automation credentials

on:
  push:
    branches: [fix/codex-dispatch-safety]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_TRIGGER_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo 'OPENAI_API_KEY_PRESENT=true'
          else
            echo 'OPENAI_API_KEY_PRESENT=false'
          fi
          if [ -n "${CODEX_TRIGGER_TOKEN:-}" ]; then
            echo 'CODEX_TRIGGER_TOKEN_PRESENT=true'
          else
            echo 'CODEX_TRIGGER_TOKEN_PRESENT=false'
          fi
