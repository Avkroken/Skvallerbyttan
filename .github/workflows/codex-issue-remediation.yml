name: Codex issue remediation bridge (centralized)

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: codex-issue-remediation-observer
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.event.issue.pull_request == null &&
      ((github.actor == 'gamnacken[bot]' && contains(github.event.comment.body, '<!-- skvallerbyttan-remediation:active -->')) ||
       (github.actor == 'blixten85' && contains(github.event.comment.body, '<!-- skvallerbyttan-remediation:retry -->')))
    runs-on: ubuntu-latest
    steps:
      - name: Report centralized ownership
        shell: bash
        run: |
          set -euo pipefail
          echo 'Remediation dispatch is owned by Avkroken/Skvallerbyttan codex-security-dispatch.yml.'
          echo 'This compatibility workflow intentionally performs no branch, PR, comment, or auto-merge mutation.'
          echo 'The central dispatcher runs every five minutes and fails closed when its Codex user credential is unavailable.'
