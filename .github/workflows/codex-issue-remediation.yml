name: Codex issue remediation bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: codex-issue-remediation
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Validera betrodd remediation-trigger
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")"
          is_pr="$(jq -r 'has("issue") and (.issue | has("pull_request"))' "$GITHUB_EVENT_PATH")"
          user="$(jq -r '.comment.user.login // empty' "$GITHUB_EVENT_PATH")"
          body="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"

          eligible=false
          if [ -n "$issue_number" ] && [ "$is_pr" != "true" ]; then
            if [ "$user" = "gamnacken[bot]" ] && grep -Fq '<!-- skvallerbyttan-remediation:active -->' <<<"$body"; then
              eligible=true
            elif [ "$user" = "blixten85" ] && grep -Fq '<!-- skvallerbyttan-remediation:retry -->' <<<"$body"; then
              eligible=true
            fi
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Hämta Gamnacken App-token
        if: steps.gate.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.eligible == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Kontrollera om issue redan har en Codex-PR
        if: steps.gate.outputs.eligible == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          marker="<!-- skvallerbyttan-codex-pr:${ISSUE_NUMBER} -->"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" --jq '.[].body' | grep -Fq -- "$marker"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Välj ledig arbetsgren
        if: steps.gate.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main work/fix work/chore work/feature
          main_sha="$(git rev-parse origin/main)"

          for branch in work/fix work/chore work/feature; do
            branch_sha="$(git rev-parse "origin/${branch}")"
            open_prs="$(gh pr list --state open --head "$branch" --json number --jq 'length')"
            if [ "$branch_sha" = "$main_sha" ] && [ "$open_prs" = "0" ]; then
              echo "name=$branch" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          body_file="$(mktemp)"
          cat > "$body_file" <<'EOF'
          <!-- skvallerbyttan-codex-dispatch:blocked -->
          Codex-dispatchen kunde inte starta: alla poolgrenar (`work/fix`, `work/chore`, `work/feature`) är upptagna eller ligger inte exakt på `main`. Ingen branch eller protection kringgicks.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"
          echo "Ingen ledig poolgren för Codex-remediation" >&2
          exit 1

      - name: Skapa seed-commit
        if: steps.gate.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name "gamnacken[bot]"
          git config user.email "316993076+gamnacken[bot]@users.noreply.github.com"

          seed_dir=".github/codex-dispatch"
          seed_file="${seed_dir}/issue-${ISSUE_NUMBER}.md"
          mkdir -p "$seed_dir"
          cat > "$seed_file" <<EOF
          # Codex remediation seed

          This temporary file exists only to create a pull request context for security issue #${ISSUE_NUMBER}.

          Codex must read the issue, implement and verify the smallest safe fix, and delete this file before the pull request is complete.
          EOF

          git add "$seed_file"
          git commit -m "chore: seed Codex remediation for #${ISSUE_NUMBER}"
          git push origin "HEAD:$BRANCH"

      - name: Skapa PR och armera auto-merge
        if: steps.gate.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        id: pr
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- skvallerbyttan-remediation -->
          <!-- skvallerbyttan-remediation-issue:${ISSUE_NUMBER} -->

          Automatisk Codex-remediation för säkerhetsissue #${ISSUE_NUMBER}.

          Seed-filen under `.github/codex-dispatch/` är tillfällig och ska tas bort av Codex innan PR:n är färdig.

          Fixes #${ISSUE_NUMBER}
          EOF

          pr_url="$(gh pr create --base main --head "$BRANCH" --title "fix(security): remediate issue #${ISSUE_NUMBER}" --body-file "$body_file")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          gh pr merge --auto --squash "$pr_url"

      - name: Delegera arbetet till Codex på PR:n
        if: steps.gate.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          prompt_file="$(mktemp)"
          cat > "$prompt_file" <<EOF
          @codex implement security issue #${ISSUE_NUMBER} autonomously on this PR.

          Requirements:
          - Read issue #${ISSUE_NUMBER} and verify the underlying security finding.
          - Read and follow AGENTS.md and SKILLS.md before changing code.
          - Make the smallest safe fix without changing or dismissing the security alert state.
          - Keep all work on this existing PR/branch; do not create another branch or PR.
          - Delete `.github/codex-dispatch/issue-${ISSUE_NUMBER}.md` before completion.
          - Run the relevant tests/typechecks and fix every valid CI or review finding on this same PR.
          - Re-read review summaries and unresolved inline threads after every push.
          - Resolve a review thread only after its valid finding is fixed or a concrete evidentiary reply shows why no change is correct.
          - Auto-merge is already armed; do not bypass branch protection, required checks, review resolution, or the merge queue.
          EOF
          gh pr comment "$PR_URL" --body-file "$prompt_file"

          issue_body="$(mktemp)"
          cat > "$issue_body" <<EOF
          <!-- skvallerbyttan-codex-pr:${ISSUE_NUMBER} -->
          Codex-remediation har flyttats till PR-kontext: ${PR_URL}. Auto-merge är armerad; CI, review-trådar och merge queue är fortsatt blockerande.
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file "$issue_body"
